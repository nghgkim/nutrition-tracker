services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nutrition_tracker
      POSTGRES_USER: nutrition_tracker
      POSTGRES_PASSWORD: nutrition_tracker_dev_pw
    volumes:
      - nutrition-tracker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition_tracker -d nutrition_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: nutrition-tracker:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nutrition_tracker:nutrition_tracker_dev_pw@db:5432/nutrition_tracker
      JWT_SECRET: change-me-to-a-long-random-string-in-production
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BAjLh-Z7uScT8uRMqgV_i6onUODiraoVdqLelp_RE4PWG1KbXiekCCf0wjJBk1r8rSM2tWH6eFZtuBXYdmTEV7w
      VAPID_PRIVATE_KEY: 32Eu3sGvVjk0xshvY_VDY-ajzeXLU0X6MXKQiW7ap2o
      CRON_SECRET: nutrition-tracker-cron
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/login').then(r=>process.exit(r.status===200?0:1))\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  scheduler:
    image: curlimages/curl:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "while true; do curl -sf -H 'Authorization: Bearer nutrition-tracker-cron' http://app:3000/api/auth/me || true; sleep 60; done"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: tunnel --url http://app:3000

volumes:
  nutrition-tracker-pgdata:
    external: true
