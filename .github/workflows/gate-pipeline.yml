name: 4-Phase SDLC Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Phase 1 — Typecheck
        run: npm run typecheck

      - name: Phase 2 — Lint
        run: npm run lint

      - name: Phase 2 & 3 — Unit tests
        run: npm test

      - name: Phase 3 — Production build
        run: npm run build

      - name: Phase 4 — Optional repository-local governance
        run: |
          if [ -x ./scripts/gate ]; then
            CI=1 ./scripts/gate check --tier=auto --mode=auto
          else
            echo "::notice ::No repository-local gate CLI; npm QC steps above are authoritative."
          fi
